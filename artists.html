  <style>

    .roster-scroll {

      height: 4.5px;
    }

    .roster-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .roster-scroll::-webkit-scrollbar-thumb {
      background: #ff5f1f;
      border-radius: 999px;

    .glow-title {
      text-shadow: 0 0 10px rgba(182, 243, 255, 0.62), 0 0 22px rgba(182, 243, 255, 0.28);
    }

    .mobile-nav .nav-item {
      font-weight: 800 !important;
    }

    .roster-scroll button,
    .roster-scroll img {
      -webkit-user-drag: none;
      user-select: none;
    }
  </style>

<body class="bg-[#0c0c0d] text-white antialiased">

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    // Update these image paths or Spotify URLs as roster assets change.
    const artists = [
      {
        id: 1,
        name: "TRE",
        image: "Assets/Images/TRE-1.jpg?v=2",
        spotifyUrl: "https://open.spotify.com/artist/1ZRS6F36zdg8YJecOzksbt?si=Nu3Itl9wQySl8WvRpBcN5g"
      },
      {
        id: 2,
        name: "THEMIS",
        image: "Assets/Images/THEMIS-1.jpeg",
        spotifyUrl: "https://open.spotify.com/artist/5pLpxDPAMMysUBcJKBKigU?si=sGhQQ1MlRA2-Wd_AobQRng"
      },
      {
        id: 3,
        name: "Jwill The Ego",
        image: "Assets/Images/Jwill-1.JPEG?v=2",
        spotifyUrl: "https://open.spotify.com/artist/3kKc5KCyBUaCib23LTvMK9?si=6dPLxiJhStCesnfTQ1K0Nw"
      },
      {
        id: 4,
        name: "Matsang",
        image: "Assets/Images/Matsang-2.png?v=2",
        imagePosition: "center 42%",
        spotifyUrl: "https://open.spotify.com/artist/6azM6975OGejyThNPgssDM?si=2Bv8sC_1S5OCj2ALAd4znw"
      },
      {
        id: 5,
        name: "JU$",
        image: "Assets/Images/JU$-1.jpg?v=3",
        spotifyUrl: "https://open.spotify.com/artist/21MSzgW2oT0WOpdiFA1fqa?si=dKtsIUloQhSAR6GFQmMLog"
      },
      {
        id: 6,
        name: "BOOMR",
        image: "Assets/Images/BOOMR-1.jpg",
        spotifyUrl: "https://open.spotify.com/artist/2ivOnONfRdKg3hXyRouZV5?si=KBR4tDhgRhGA-ndhzCyYpA"
      },
      {
        id: 7,
        name: "WillCREATE",
        image: "Assets/Images/WillCREATE-1.jpg?v=2",
        spotifyUrl: "https://open.spotify.com/artist/0wmsqHHRprWgVaEmijXPHr?si=VfPt1wM6TqyYdRZt6D3C0w"
      },
      {
        id: 8,
        name: "DCK4CVR",
        image: "Assets/Images/DCK4CVR-1.png",
        spotifyUrl: "https://open.spotify.com/artist/4Y1s7ztVUzsp2IP1PnVueK?si=p1oSB8LXT_C0qFNplwgV2A"
      }
    ];

    function ArtistTile({ artist }) {
      const handleClick = (event) => {
        if (!artist.spotifyUrl || artist.spotifyUrl.endsWith("/...")) return;
        window.open(artist.spotifyUrl, "_blank", "noopener,noreferrer");
      };

      return (
        <button
          type="button"
          onClick={handleClick}
          className="group w-[72vw] max-w-[320px] shrink-0 text-left outline-none transition duration-200 active:scale-[0.99] sm:w-[42vw] lg:w-[320px]"
          aria-label={`Open ${artist.name} on Spotify`}
        >
          <div className="grid aspect-square place-items-center overflow-hidden border border-white/10 bg-[#151515] transition duration-200 group-hover:border-[#ff5f1f] group-hover:bg-[#1b1b1b] group-hover:shadow-[inset_0_0_0_1px_rgba(255,95,31,0.75)] group-focus-visible:ring-2 group-focus-visible:ring-[#ff5f1f] group-focus-visible:ring-offset-4 group-focus-visible:ring-offset-[#0c0c0d]">
            {artist.image ? (
              <img
                src={artist.image}
                alt={`${artist.name} artist image`}
                loading="lazy"
                draggable="false"
                className="h-full w-full object-cover"
                style={{ objectPosition: artist.imagePosition || "center center" }}
              />
            ) : (
              <span className="text-sm font-medium text-white/45">Artist Image</span>
            )}
          </div>
          <p className="mt-3 text-sm font-semibold leading-tight text-white transition group-hover:text-[#ff5f1f] sm:text-[15px]">
            {artist.name}
          </p>
        </button>
      );
    }

    function ArtistRosterPage() {
      const scrollRef = React.useRef(null);

      React.useEffect(() => {
        const scroller = scrollRef.current;
        if (!scroller) return undefined;

        let animationFrame = null;
        let virtualCurrent = scroller.scrollLeft;
        let virtualTarget = scroller.scrollLeft;

        const wrapScroll = (value, maxScrollLeft) => {
          if (maxScrollLeft <= 0) return 0;
          const wrapped = value % maxScrollLeft;
          return wrapped < 0 ? wrapped + maxScrollLeft : wrapped;
        };

        const animateScroll = () => {
          const maxScrollLeft = scroller.scrollWidth - scroller.clientWidth;
          const distance = virtualTarget - virtualCurrent;

          if (Math.abs(distance) < 0.35) {
            virtualCurrent = virtualTarget;
            scroller.scrollLeft = wrapScroll(virtualCurrent, maxScrollLeft);
            animationFrame = null;
            return;
          }

          virtualCurrent += distance * 0.14;
          scroller.scrollLeft = wrapScroll(virtualCurrent, maxScrollLeft);
          animationFrame = window.requestAnimationFrame(animateScroll);
        };

        const handleWheel = (event) => {
          const maxScrollLeft = scroller.scrollWidth - scroller.clientWidth;
          if (maxScrollLeft <= 0) return;

          const modeScale = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? scroller.clientWidth : 1;
          const delta = (Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY) * modeScale;
          if (!delta) return;

          event.preventDefault();

          if (animationFrame === null) {
            virtualCurrent = scroller.scrollLeft;
            virtualTarget = scroller.scrollLeft;
          }

          virtualTarget += delta * 0.45;

          if (animationFrame === null) {
            animationFrame = window.requestAnimationFrame(animateScroll);
          }
        };

        scroller.addEventListener("wheel", handleWheel, { passive: false });

        return () => {
          if (animationFrame !== null) {
            window.cancelAnimationFrame(animationFrame);
          }
          scroller.removeEventListener("wheel", handleWheel);
        };
      }, []);

      const handleKeyDown = (event) => {
        if (!scrollRef.current) return;

        if (event.key === "ArrowRight") {
          event.preventDefault();
          scrollRef.current.scrollBy({ left: 340, behavior: "smooth" });
        }

        if (event.key === "ArrowLeft") {
          event.preventDefault();
          scrollRef.current.scrollBy({ left: -340, behavior: "smooth" });
        }
      };

      return (
        <main className="min-h-[calc(100vh-220px)] bg-[#0c0c0d] px-4 py-6 text-white sm:px-8 sm:py-10">
          <section className="mx-auto max-w-[1040px]">
            <header className="mb-8 border-b border-white/10 pb-5 sm:mb-10">
              <div>
                <h1 className="glow-title font-display text-5xl leading-none tracking-normal text-white sm:text-7xl">
                  ARTISTS
                </h1>
                <p className="mt-4 max-w-[760px] text-[clamp(0.95rem,1.3vw,1.14rem)] font-normal leading-snug text-white">
                  Scroll to view. Click on an artist to stream
                </p>
              </div>
            </header>

            <div
              ref={scrollRef}
              tabIndex="0"
              onKeyDown={handleKeyDown}
              className="roster-scroll flex gap-4 overflow-x-auto overscroll-contain pb-6 pr-4 pt-1 outline-none sm:gap-5 sm:pr-8"
              aria-label="Scrollable artist roster"
            >
              {artists.map((artist) => (
                <ArtistTile key={artist.id} artist={artist} />
              ))}
            </div>
          </section>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<ArtistRosterPage />);
  </script>
</body>
